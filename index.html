<html lang="ja">
<head>

  <!-- ========================================== -->
  <!-- ⚙️ 設定パラメータ（ここを変更すれば全体に自動反映されます） -->
  <!-- ========================================== -->
  <script>
    const DEFAULT_CONFIG = {

        step: 10

        step: 10

        min: 0,
        max: 300,
        step: 10
      },
      rent: {
        val: 17.0,      // 想定月額賃料 (万円)
        min: 14.0,
        max: 25.0,

  <style>

      --secondary: #0284c7;

      --card-bg: #ffffff;

      --text: #1e293b;

  <script>
    function calcPmt(principalYen, annualRatePercent, years) {
      if (principalYen <= 0 || !years || years <= 0) return 0;
      const n = Math.round(years * 12);
      const rate = parseFloat(annualRatePercent) || 0;
      if (rate <= 0) return principalYen / n;
      const r = (rate / 100) / 12;
      const factor = Math.pow(1 + r, n);
      if (!isFinite(factor) || factor <= 1) return principalYen / n;
      return principalYen * (r * factor) / (factor - 1);
    }

    function calcBalanceSchedule(principalMan, annualRatePercent, years, maxYears) {
      const schedule = [principalMan];
      if (principalMan <= 0 || years <= 0) {
        for (let y = 1; y <= maxYears; y++) schedule.push(0);
        return schedule;
      }
      const r = (parseFloat(annualRatePercent) || 0) / 100 / 12;
      const n = Math.round(years * 12);
      const pmtYen = calcPmt(principalMan * 10000, annualRatePercent, years);

      let balance = principalMan * 10000;
      for (let m = 1; m <= maxYears * 12; m++) {
        if (m <= n && balance > 0) {
          const interest = balance * r;
          const principal = Math.min(balance, pmtYen - interest);
          balance = Math.max(0, balance - principal);
        } else {
          balance = 0;
        }
        if (m % 12 === 0) {
          schedule.push(Math.round(balance / 10000));
        }
      }
      return schedule;
    }

    const dom = {
      price: document.getElementById('param-price'),
      reno: document.getElementById('param-reno'),
      equityDown: document.getElementById('param-equity-down'),
      equityMisc: document.getElementById('param-equity-misc'),
      rent: document.getElementById('param-rent'),

      limitPriceMin: document.getElementById('limit-price-min'),
      limitPriceMax: document.getElementById('limit-price-max'),
      limitRenoMin: document.getElementById('limit-reno-min'),

      limitDownMin: document.getElementById('limit-down-min'),
      limitDownMax: document.getElementById('limit-down-max'),
      limitMiscMin: document.getElementById('limit-misc-min'),
      limitMiscMax: document.getElementById('limit-misc-max'),
      limitRentMin: document.getElementById('limit-rent-min'),
      limitRentMax: document.getElementById('limit-rent-max'),
      limitOpexMin: document.getElementById('limit-opex-min'),
      limitOpexMax: document.getElementById('limit-opex-max'),

      balanceIndicator: document.getElementById('balance-indicator'),

      bankAmt: document.getElementById('loan-bank-amount'),
      bankRate: document.getElementById('loan-bank-rate'),
      bankYrs: document.getElementById('loan-bank-years'),

      kokoEqEnable: document.getElementById('loan-koko-eq-enable'),
      kokoEqContainer: document.getElementById('koko-eq-container'),
      kokoEqAmt: document.getElementById('loan-koko-eq-amount'),
      kokoEqRate: document.getElementById('loan-koko-eq-rate'),
      kokoEqYrs: document.getElementById('loan-koko-eq-years'),

      kpiTotal: document.getElementById('kpi-total'),
      kpiYield: document.getElementById('kpi-gross-yield'),
      kpiNetYield: document.getElementById('kpi-net-yield'),
      kpiRepay: document.getElementById('kpi-repay'),
      kpiPayback: document.getElementById('kpi-payback'),

      btnChartCf: document.getElementById('btn-chart-cf'),
      btnChartDebt: document.getElementById('btn-chart-debt'),

      tableHeadRow: document.getElementById('table-head-row'),
      tableBody: document.getElementById('table-body')
    };

    // --- 上部のDEFAULT_CONFIGを設定へ反映 ---
    function applyConfig() {
      const cfg = DEFAULT_CONFIG;

      // 1. スライダー属性と初期値
      const setupSlider = (elem, conf, minEl, maxEl, unit = '万') => {
        elem.min = conf.min;
        elem.max = conf.max;
        elem.step = conf.step;
        elem.value = conf.val;
        if (minEl) minEl.textContent = `${conf.min.toLocaleString()}${unit}`;
        if (maxEl) maxEl.textContent = `${conf.max.toLocaleString()}${unit}`;
      };

      setupSlider(dom.price, cfg.price, dom.limitPriceMin, dom.limitPriceMax, '万');
      setupSlider(dom.reno, cfg.reno, dom.limitRenoMin, dom.limitRenoMax, '万');
      setupSlider(dom.equityDown, cfg.equityDown, dom.limitDownMin, dom.limitDownMax, '万');
      setupSlider(dom.equityMisc, cfg.equityMisc, dom.limitMiscMin, dom.limitMiscMax, '万');
      setupSlider(dom.rent, cfg.rent, dom.limitRentMin, dom.limitRentMax, '万');
      setupSlider(dom.opex, cfg.opex, dom.limitOpexMin, dom.limitOpexMax, '%');

      // 2. 借入条件
      dom.bankAmt.value = cfg.bank.amount;
      dom.bankRate.value = cfg.bank.rate;
      dom.bankYrs.value = cfg.bank.years;

      dom.kokoEqEnable.checked = cfg.kokoEq.enabled;
      dom.kokoEqAmt.value = cfg.kokoEq.amount;
      dom.kokoEqRate.value = cfg.kokoEq.rate;
      dom.kokoEqYrs.value = cfg.kokoEq.years;
    }

    applyConfig();

    let currentChartMode = 'cf';
    const ctx = document.getElementById('cfChart').getContext('2d');
    let cfChart = null;

    function initChart(mode) {
      if (cfChart) {
        cfChart.destroy();
      }
      if (mode === 'cf') {
        cfChart = new Chart(ctx, {
          type: 'bar',
          data: { labels: [], datasets: [] },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { labels: { boxWidth: 10, font: { size: 10 } } }
            },
            scales: {
              x: { ticks: { font: { size: 9 } } },
              y: { 
                title: { display: false },
                ticks: { font: { size: 9 }, callback: v => v.toLocaleString() + '円' }
              }
            }
          }
        });
      } else {
        cfChart = new Chart(ctx, {
          type: 'line',
          data: { labels: [], datasets: [] },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
              legend: { labels: { boxWidth: 10, font: { size: 10 } } }
            },
            scales: {
              x: { 
                ticks: { 
                  font: { size: 9 },
                  maxRotation: 45,
                  minRotation: 0,
                  autoSkip: true,
                  maxTicksLimit: 12
                } 
              },
              y: { 
                title: { display: true, text: '残債 (万円)', font: { size: 9 } },
                ticks: { font: { size: 9 }, callback: v => v.toLocaleString() + '万' },
                min: 0
              }
            }
          }
        });
      }
    }

    initChart(currentChartMode);

    dom.btnChartCf.addEventListener('click', () => {
      if (currentChartMode === 'cf') return;
      currentChartMode = 'cf';
      dom.btnChartCf.classList.add('active');
      dom.btnChartDebt.classList.remove('active');
      initChart('cf');
      calculate();
    });

    dom.btnChartDebt.addEventListener('click', () => {
      if (currentChartMode === 'debt') return;
      currentChartMode = 'debt';
      dom.btnChartDebt.classList.add('active');
      dom.btnChartCf.classList.remove('active');
      initChart('debt');
      calculate();
    });

    let isBankAmtManuallyEdited = false;
    let isKokoAmtManuallyEdited = false;

    function syncLoanAmounts(force = false) {
      const p = parseFloat(dom.price.value) || 0;
      const r = parseFloat(dom.reno.value) || 0;
      const eqDown = parseFloat(dom.equityDown.value) || 0;
      const hasEq = dom.kokoEqEnable.checked;

      if (hasEq) {
        if (!isKokoAmtManuallyEdited || force) {
          dom.kokoEqAmt.value = Math.round(r);
        }
        if (!isBankAmtManuallyEdited || force) {
          dom.bankAmt.value = Math.max(0, Math.round(p - eqDown));
        }
      } else {
        if (!isBankAmtManuallyEdited || force) {
          dom.bankAmt.value = Math.max(0, Math.round((p + r) - eqDown));
        }
      }
    }

    function calculate() {
      const price = parseFloat(dom.price.value) || 0;
      const reno  = parseFloat(dom.reno.value) || 0;
      const eqDown = parseFloat(dom.equityDown.value) || 0;
      const eqMisc = parseFloat(dom.equityMisc.value) || 0;
      const totalEquity = eqDown + eqMisc;

      const rentMan = parseFloat(dom.rent.value) || 0;
      const opexRate = (parseFloat(dom.opex.value) || 0) / 100;

      dom.dispPrice.textContent = price.toLocaleString() + ' 万円';
      dom.dispReno.textContent  = reno.toLocaleString() + ' 万円';
      dom.dispEquityDown.textContent = eqDown.toLocaleString() + ' 万円';
      dom.dispEquityMisc.textContent = eqMisc.toLocaleString() + ' 万円';
      dom.dispEquityTotal.textContent = totalEquity.toLocaleString();
      dom.dispRent.textContent  = rentMan.toFixed(1) + ' 万円';
      dom.dispOpex.textContent  = Math.round(opexRate * 100) + ' %';

      const totalProject = price + reno + eqMisc;

      const rentYen = rentMan * 10000;
      const opexYen = Math.round(rentYen * opexRate);
      const noiYen  = rentYen - opexYen;

      const hasEq = dom.kokoEqEnable.checked;

      const bankLabelText = hasEq 
        ? '① 民間金融機関（物件購入資金）' 
        : '① 民間金融機関（物件購入資金、設備資金）';
      dom.bankTitleLabel.textContent = bankLabelText;
      dom.kokoEqContainer.classList.toggle('disabled', !hasEq);

      const bankYrs = Math.max(1, parseFloat(dom.bankYrs.value) || 1);
      const eqYrs   = hasEq ? Math.max(1, parseFloat(dom.kokoEqYrs.value) || 1) : 0;

      const bankAmt = Math.max(0, parseFloat(dom.bankAmt.value) || 0);
      const eqAmt   = hasEq ? Math.max(0, parseFloat(dom.kokoEqAmt.value) || 0) : 0;

      const totalFunding = totalEquity + bankAmt + eqAmt;
      const fundingDiff = Math.round(totalFunding - totalProject);

      dom.balanceIndicator.className = 'balance-indicator';
      if (fundingDiff === 0) {
        dom.balanceIndicator.classList.add('balance-matched');
        dom.balanceStatusText.textContent = `✓ 資金バランス一致（総事業費 ${Math.round(totalProject)}万 ＝ 調達計 ${Math.round(totalFunding)}万）`;
        dom.balanceDiffText.textContent = '過不足なし';
        dom.bankAmt.classList.remove('mismatch');

        isBankAmtManuallyEdited = false;
        isKokoAmtManuallyEdited = false;
      } else if (fundingDiff < 0) {
        dom.balanceIndicator.classList.add('balance-shortage');
        dom.balanceStatusText.textContent = `⚠️ 調達不足：あと ${Math.abs(fundingDiff)} 万円必要`;
        dom.balanceDiffText.textContent = `不足 ▲${Math.abs(fundingDiff)} 万円`;
        dom.bankAmt.classList.add('mismatch');
      } else {
        dom.balanceIndicator.classList.add('balance-excess');
        dom.balanceStatusText.textContent = `ℹ️ 調達過剰：総事業費より +${fundingDiff} 万円余剰`;
        dom.balanceDiffText.textContent = `余剰 +${fundingDiff} 万円`;
        dom.bankAmt.classList.remove('mismatch');
      }

      const pmtBank = calcPmt(bankAmt * 10000, parseFloat(dom.bankRate.value) || 0, bankYrs);
      const pmtEq   = hasEq ? calcPmt(eqAmt * 10000, parseFloat(dom.kokoEqRate.value) || 0, eqYrs) : 0;

      const activeYears = [bankYrs];
      if (hasEq && eqYrs > 0) activeYears.push(eqYrs);
      const breakpoints = Array.from(new Set(activeYears)).sort((a, b) => a - b);

      const stages = [];
      let prevYr = 0;
      breakpoints.forEach((yr) => {
        const isBankActive = yr <= bankYrs;
        const isEqActive   = hasEq && (yr <= eqYrs);

        let periodLabel = '';
        if (breakpoints.length === 1) {
          periodLabel = `${yr}年間`;
        } else {
          periodLabel = prevYr === 0 ? `当初${yr}年間` : `${prevYr + 1}〜${yr}年目`;
        }

        const activeBadges = [];
        if (isBankActive) activeBadges.push('①');
        if (isEqActive)   activeBadges.push('②');
        
        const badgeHtml = activeBadges.length > 0 
          ? `<span class="loan-badge">${activeBadges.join('')}</span>` 
          : '';

        const stageRepayBank = isBankActive ? pmtBank : 0;
        const stageRepayEq   = isEqActive   ? pmtEq   : 0;
        const totalRepay     = stageRepayBank + stageRepayEq;
        const cf             = noiYen - totalRepay;

        stages.push({
          fromYr: prevYr,
          toYr: yr,
          yearsCount: yr - prevYr,
          label: `${periodLabel}${badgeHtml}`,
          chartLabel: `${periodLabel}${activeBadges.length > 0 ? ' (' + activeBadges.join('') + ')' : ''}`,
          repayBank: stageRepayBank,
          repayEq: stageRepayEq,
          totalRepay: totalRepay,
          cf: cf
        });

        prevYr = yr;
      });

      dom.kpiTotal.textContent = Math.round(totalProject).toLocaleString() + ' 万円';
      
      const grossYield = totalProject > 0 ? ((rentMan * 12) / totalProject) * 100 : 0;
      dom.kpiYield.textContent = grossYield.toFixed(2) + ' %';
      
      const netYield = totalProject > 0 ? ((noiYen * 12) / (totalProject * 10000)) * 100 : 0;
      dom.kpiNetYield.textContent = netYield.toFixed(2) + ' %';

      const initialRepay = stages.length > 0 ? stages[0].totalRepay : 0;
      dom.kpiRepay.textContent = (initialRepay / 10000).toFixed(1) + ' 万円';

      if (totalEquity <= 0) {
        dom.kpiPayback.textContent = 'フルローン';
      } else {
        const targetEquityYen = totalEquity * 10000;
        let cumulativeCf = 0;
        let paybackYear = null;

        for (let y = 1; y <= 50; y++) {
          let stageForYear = stages.find(s => y > s.fromYr && y <= s.toYr);
          let annualCfForYear = stageForYear ? (stageForYear.cf * 12) : (noiYen * 12);

          const prevCumulative = cumulativeCf;
          cumulativeCf += annualCfForYear;

          if (prevCumulative < targetEquityYen && cumulativeCf >= targetEquityYen && paybackYear === null) {
            const neededInThisYear = targetEquityYen - prevCumulative;
            const fraction = annualCfForYear > 1 ? Math.max(0, Math.min(1, neededInThisYear / annualCfForYear)) : 0;
            paybackYear = (y - 1) + fraction;
            break;
          }
        }

        if (paybackYear !== null) {
          dom.kpiPayback.textContent = paybackYear.toFixed(1) + ' 年';
        } else {
          dom.kpiPayback.textContent = '50年超/不可';
        }
      }

      const fmtYen = (val) => Math.round(val).toLocaleString() + ' 円';
      const fmtMinus = (val) => val > 0 ? '▲' + Math.round(val).toLocaleString() + ' 円' : '0 円';
      const formatYenWithSign = (val) => (val >= 0 ? '+' : '') + Math.round(val).toLocaleString() + ' 円';

      let theadHtml = '<th>収支内訳項目</th>';
      stages.forEach(s => { theadHtml += `<th>${s.label}</th>`; });
      dom.tableHeadRow.innerHTML = theadHtml;

      let rentRow = `<tr><td>想定月額賃料</td>${stages.map(() => `<td>${fmtYen(rentYen)}</td>`).join('')}</tr>`;
      let opexRow = `<tr><td>運営管理経費 (${Math.round(opexRate * 100)}%)</td>${stages.map(() => `<td>${fmtMinus(opexYen)}</td>`).join('')}</tr>`;
      let bankRow = `<tr><td>${bankLabelText} (${Math.round(bankAmt)}万)</td>${stages.map(s => `<td>${fmtMinus(s.repayBank)}</td>`).join('')}</tr>`;
      
      let eqRow = '';
      if (hasEq) {
        eqRow = `<tr><td>② 公庫・設備 (${Math.round(eqAmt)}万)</td>${stages.map(s => `<td>${fmtMinus(s.repayEq)}</td>`).join('')}</tr>`;
      }
      
      let cfRow = `<tr class="total-row"><td>税引前月額CF</td>` +
        stages.map(s => {
          const color = s.cf >= 0 ? 'var(--accent-green)' : 'var(--accent-red)';
          return `<td style="color: ${color}">${formatYenWithSign(s.cf)}</td>`;
        }).join('') + `</tr>`;

      let annualCfRow = `<tr class="annual-total-row"><td>税引前年間CF</td>` +
        stages.map(s => {
          const annualCf = s.cf * 12;
          const color = annualCf >= 0 ? 'var(--accent-green)' : 'var(--accent-red)';
          return `<td style="color: ${color}">${formatYenWithSign(annualCf)}</td>`;
        }).join('') + `</tr>`;

      dom.tableBody.innerHTML = rentRow + opexRow + bankRow + eqRow + cfRow + annualCfRow;

      if (currentChartMode === 'cf') {
        cfChart.data.labels = stages.map(s => s.chartLabel);
        cfChart.data.datasets = [
          { label: '月額返済総額', data: stages.map(s => Math.round(s.totalRepay)), backgroundColor: '#f87171' },
          { label: '月額CF', data: stages.map(s => Math.round(s.cf)), backgroundColor: '#38bdf8' }
        ];
      } else {
        const startYear = new Date().getFullYear();
        const maxLoanYrs = Math.max(bankYrs, eqYrs, 1);
        const debtLabels = [];
        for (let y = 0; y <= maxLoanYrs; y++) {
          debtLabels.push(`${startYear + y}年`);
        }

        const bankDebtSchedule = calcBalanceSchedule(bankAmt, dom.bankRate.value, bankYrs, maxLoanYrs);
        const eqDebtSchedule = hasEq 
          ? calcBalanceSchedule(eqAmt, dom.kokoEqRate.value, eqYrs, maxLoanYrs)
          : new Array(maxLoanYrs + 1).fill(0);

        const totalDebtSchedule = bankDebtSchedule.map((b, idx) => b + eqDebtSchedule[idx]);

        const lineDatasets = [
          {
            label: '借入残債合計',
            data: totalDebtSchedule,
            borderColor: '#1e3a8a',
            backgroundColor: 'rgba(30, 58, 138, 0.08)',
            fill: true,
            tension: 0.15,
            borderWidth: 2.5,
            pointRadius: 2
          }
        ];

        if (hasEq) {
          lineDatasets.push({
            label: '① 民間残債',
            data: bankDebtSchedule,
            borderColor: '#0284c7',
            borderDash: [4, 4],
            tension: 0.15,
            borderWidth: 1.5,
            pointRadius: 0
          });
          lineDatasets.push({
            label: '② 公庫残債',
            data: eqDebtSchedule,
            borderColor: '#f59e0b',
            borderDash: [3, 3],
            tension: 0.15,
            borderWidth: 1.5,
            pointRadius: 0
          });
        }

        cfChart.data.labels = debtLabels;
        cfChart.data.datasets = lineDatasets;
      }
      cfChart.update('none');
    }

    [dom.price, dom.reno, dom.equityDown].forEach(el => {
      el.addEventListener('input', () => {
        syncLoanAmounts(false);
        calculate();
      });
    });

    dom.equityMisc.addEventListener('input', calculate);

    dom.kokoEqEnable.addEventListener('change', () => {
      isBankAmtManuallyEdited = false;
      isKokoAmtManuallyEdited = false;
      syncLoanAmounts(true);
      calculate();
    });

    dom.bankAmt.addEventListener('input', () => {
      isBankAmtManuallyEdited = true;
      calculate();
    });

    dom.kokoEqAmt.addEventListener('input', () => {
      isKokoAmtManuallyEdited = true;
      calculate();
    });

    [dom.rent, dom.opex, dom.bankRate, dom.bankYrs, dom.kokoEqRate, dom.kokoEqYrs].forEach(el => {
      el.addEventListener('input', calculate);
    });

    syncLoanAmounts(true);
    calculate();
  </script>
</body>
</html>
